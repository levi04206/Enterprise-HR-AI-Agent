server:
  port: 8080

spring:
  application:
    name: enterprise-hr-ai-agent

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 你给出的 MySQL 地址已按本项目库名调整为 enterprise_hr_ai_agent。
    # 启动前请先创建数据库：
    # CREATE DATABASE enterprise_hr_ai_agent DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    url: jdbc:mysql://localhost:3306/enterprise_hr_ai_agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: '0206'

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  sql:
    init:
      # 默认 MySQL 环境交给 Flyway 管理版本化迁移，避免 schema.sql 每次启动重复执行。
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  ai:
    vectorstore:
      type: ${AI_VECTOR_STORE_TYPE:in-memory}
    openai:
      # API Key 不写入代码。优先读取你后续配置的 OPENAI_API_KEY，兼容旧变量 AI_API_KEY。
      api-key: ${OPENAI_API_KEY:${AI_API_KEY:replace-me}}
      # DeepSeek OpenAI 兼容接口。
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-chat}
          temperature: ${AI_CHAT_TEMPERATURE:0.5}
      embedding:
        # Embedding 使用阿里 DashScope OpenAI 兼容模式，和 DeepSeek Chat 分开配置。
        base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${DASHSCOPE_API_KEY:${AI_EMBEDDING_API_KEY:replace-me}}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  ai:
    top-k: 3
    # 每次带 sessionId 对话时，注入最近 N 条历史消息帮助模型理解上下文。
    # 历史消息只作为对话上下文，制度问题仍以 RAG 检索到的 Context 为准。
    history-size: 8
  security:
    # 默认开发模式关闭鉴权，避免影响本地接口调试。
    # 启用 secure profile 后会要求业务 API 携带 X-HR-EMPLOYEE-NAME，请求管理接口还需要 X-HR-ROLE=ADMIN。
    enabled: false
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
      - http://127.0.0.1:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Content-Type
    allow-credentials: true
    max-age: 3600
