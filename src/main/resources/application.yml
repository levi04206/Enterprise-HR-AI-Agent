server:
  port: 8080

spring:
  application:
    name: enterprise-hr-ai-agent

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 你给出的 MySQL 地址已按本项目库名调整为 enterprise_hr_ai_agent。
    # 启动前请先创建数据库：
    # CREATE DATABASE enterprise_hr_ai_agent DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    url: jdbc:mysql://localhost:3306/enterprise_hr_ai_agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: '0206'

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  sql:
    init:
      # Demo 阶段自动执行 schema.sql/data.sql，方便首次启动建表和导入样例数据。
      # 生产环境建议改为 never，并使用 Flyway/Liquibase 管理数据库变更。
      mode: always
      continue-on-error: true

  ai:
    openai:
      # API Key 不写入代码。优先读取你后续配置的 OPENAI_API_KEY，兼容旧变量 AI_API_KEY。
      api-key: ${OPENAI_API_KEY:${AI_API_KEY:replace-me}}
      # DeepSeek OpenAI 兼容接口。
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-chat}
          temperature: ${AI_CHAT_TEMPERATURE:0.5}
      embedding:
        # Embedding 使用阿里 DashScope OpenAI 兼容模式，和 DeepSeek Chat 分开配置。
        base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${DASHSCOPE_API_KEY:${AI_EMBEDDING_API_KEY:replace-me}}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  ai:
    top-k: 3
    # 每次带 sessionId 对话时，注入最近 N 条历史消息帮助模型理解上下文。
    # 历史消息只作为对话上下文，制度问题仍以 RAG 检索到的 Context 为准。
    history-size: 8
    # 当前仍使用内存向量库，方便先跑通主体功能。
    # 后续如果切换 Redis Stack VectorStore，再替换 VectorStoreConfig 和依赖。
    vector-store: in-memory
