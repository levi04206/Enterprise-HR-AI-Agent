services:
  mysql:
    image: mysql:8.4
    container_name: enterprise-hr-ai-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: enterprise_hr_ai_agent
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis-stack:
    image: redis/redis-stack:latest
    container_name: enterprise-hr-ai-agent-redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-stack-data:/data

volumes:
  mysql-data:
  redis-stack-data:
